# Full-scale discovery experiment: generate a diverse corpus, annotate it, mine heuristic
# candidates over the feature dataset, and benchmark-evaluate them against the built-in
# roster. `discover --out DIR` overrides `out`; Milestone 2 phase 4 tunes these values.
schema_version = 1
name = "tictactoe-discover"
game = "tictactoe"
out = "../runs/tictactoe-discover"

[generate.sweep]
schema_version = 1
game = "tictactoe"
seed = 20260823
games_per_cell = 40
evaluators = ["default"]
random_opening_plies = [0, 1, 2]

[[generate.sweep.strategies]]
name = "random"
[generate.sweep.strategies.spec]
kind = "random"

[[generate.sweep.strategies]]
name = "depth-2"
[generate.sweep.strategies.spec]
kind = "minimax"
depth = 2

[[generate.sweep.strategies]]
name = "depth-4"
[generate.sweep.strategies.spec]
kind = "minimax"
depth = 4

[[generate.sweep.strategies]]
name = "perfect"
[generate.sweep.strategies.spec]
kind = "minimax"
depth = 9

[annotate]
enabled = true

[analyze]
analyzers = ["summary", "agreement", "dataset", "mine"]

[mine]
engine = "cart"
depths = [6, 8, 12, 0]
min_leaf = 1

[discover]
games = 20
seed = 0

[report]
out = "report.md"
