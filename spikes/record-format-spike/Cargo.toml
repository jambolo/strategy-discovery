[package]
name = "record-format-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["polars"]
polars = ["dep:polars"]

[dependencies]
strategy-discovery = { path = "../.." }
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
polars = { version = "0.53", features = ["lazy", "parquet", "json", "dtype-i128"], optional = true }
