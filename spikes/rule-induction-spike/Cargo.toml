[package]
name = "rule-induction-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
strategy-discovery = { path = "../.." }
linfa = "0.8"
linfa-trees = "0.8"
ndarray = "0.16"
smartcore = { version = "0.6", features = ["serde"] }
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
